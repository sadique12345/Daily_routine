<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Daily Routine Checklist</title>
    <style>
      [hidden],
      .is-hidden {
        display: none !important;
      }

      .lock-screen {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      .pin-panel {
        width: min(420px, calc(100% - 32px));
        background: rgba(255, 255, 255, 0.88);
        border: 1px solid rgba(222, 215, 204, 0.85);
        border-radius: 8px;
        box-shadow: 0 18px 48px rgba(36, 30, 20, 0.12);
        padding: 34px;
      }

      .brand-mark {
        width: 54px;
        height: 54px;
        display: grid;
        place-items: center;
        border-radius: 8px;
        background: #176b87;
        color: #fff;
        font-weight: 900;
        margin-bottom: 18px;
      }

      .app-shell {
        width: min(1180px, calc(100% - 32px));
        margin: 0 auto;
        padding: 26px 0 42px;
      }
    </style>
    <link rel="stylesheet" href="styles.css?v=20260507-2">
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js" defer></script>
    <script src="app.js?v=20260507-2" defer></script>
  </head>
  <body>
    <div id="lockScreen" class="lock-screen">
      <section class="pin-panel" aria-labelledby="pinTitle">
        <div class="brand-mark" aria-hidden="true">DR</div>
        <h1 id="pinTitle">Daily Routine</h1>
        <p>Enter your 4 digit PIN to open your checklist.</p>
        <form id="pinForm" class="pin-form">
          <label for="pinInput">PIN</label>
          <input id="pinInput" name="pin" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" autocomplete="current-password" placeholder="0000" required>
          <button type="submit">Unlock</button>
          <span id="pinError" class="form-error" role="alert"></span>
        </form>
      </section>
    </div>

    <main id="appShell" class="app-shell is-hidden" hidden>
      <header class="topbar">
        <div>
          <p class="eyebrow">Daily Routine</p>
          <h1 id="todayHeading">Checklist</h1>
        </div>
        <div class="topbar-actions">
          <button class="icon-button" id="calendarButton" type="button" title="Open calendar" aria-label="Open calendar">
            <i data-lucide="calendar-days"></i>
            <span>Calendar</span>
          </button>
          <button class="icon-button" id="exportButton" type="button" title="Export Excel" aria-label="Export Excel">
            <i data-lucide="download"></i>
            <span>Export</span>
          </button>
          <button class="icon-button subtle" id="settingsButton" type="button" title="Settings" aria-label="Settings">
            <i data-lucide="settings"></i>
          </button>
          <button class="icon-button subtle" id="lockButton" type="button" title="Lock app" aria-label="Lock app">
            <i data-lucide="lock"></i>
          </button>
        </div>
      </header>

      <section class="date-strip" aria-label="Select date">
        <button id="previousDay" class="icon-only" type="button" title="Previous day" aria-label="Previous day"><i data-lucide="chevron-left"></i></button>
        <input id="activeDate" type="date" aria-label="Active date">
        <button id="todayButton" type="button">Today</button>
        <button id="nextDay" class="icon-only" type="button" title="Next day" aria-label="Next day"><i data-lucide="chevron-right"></i></button>
      </section>

      <section class="summary-band" aria-label="Daily summary">
        <div class="summary-item">
          <span id="completedCount">0</span>
          <small>Completed</small>
